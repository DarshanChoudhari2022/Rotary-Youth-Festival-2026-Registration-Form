<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Festival administration | Naya Bharat 2047</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin.js" defer></script>
</head>
<body class="admin-shell">
  <header class="policy-header"><a href="/">Naya Bharat 2047</a><a href="/scanner.html">Gate scanner</a></header>
  <main class="wrap admin-page">
    <h1>Festival dashboard</h1>
    <p id="admin-message" role="status"></p>
    <form id="admin-login" class="panel admin-form">
      <h2>Staff sign-in</h2>
      <label for="admin-email">Admin email</label>
      <input id="admin-email" type="email" autocomplete="username" required>
      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" autocomplete="current-password" required>
      <button disabled>Sign in</button>
    </form>
    <section id="admin-dashboard" hidden>
      <div class="admin-toolbar"><h2>Attendance by day</h2><button type="button" id="admin-sign-out">Sign out</button></div>
      <p>Two-day bookings count on both days. Demo bookings are excluded. Paid totals count active passes only.</p>
      <div id="admin-days" class="admin-days"></div>
      <h2>Registrations and tickets</h2>
      <form id="admin-search" class="admin-toolbar">
        <label for="admin-find">Registration or ticket ID</label>
        <input id="admin-find" maxlength="64">
        <button>Search</button>
      </form>
      <p id="admin-empty" hidden>No matching registrations.</p>
      <div id="admin-results" class="admin-results" aria-label="Registration results"></div>
      <div class="admin-toolbar"><button type="button" id="admin-previous">Previous</button><span id="admin-page-number"></span><button type="button" id="admin-next">Next</button></div>
    </section>
    <dialog id="admin-edit">
      <form id="admin-edit-form" class="admin-form">
        <h2>Edit participant</h2>
        <label for="edit-first">First name</label><input id="edit-first" name="first_name" maxlength="100" required>
        <label for="edit-last">Last name</label><input id="edit-last" name="last_name" maxlength="100" required>
        <label for="edit-org">College / organisation</label><input id="edit-org" name="organization" maxlength="160">
        <label for="edit-city">City</label><input id="edit-city" name="city" maxlength="100">
        <p id="edit-message" role="status"></p>
        <div class="admin-toolbar"><button>Save changes</button><button id="admin-cancel" type="button">Cancel</button></div>
      </form>
    </dialog>
  </main>
</body>
</html>
